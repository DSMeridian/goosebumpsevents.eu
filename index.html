<style>
:root{
  --black:#050507;--purple:#5545A5;--pl:#7B6CC4;--pg:rgba(85,69,165,0.4);
  --white:#F7F5FF;--grey:#9894AA;--dark:#0D0B15;--gold:#C8A96E;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--white);font-family:'DM Sans',sans-serif;font-weight:300;overflow-x:hidden;cursor:none;}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--black);}
::-webkit-scrollbar-thumb{background:var(--purple);border-radius:2px;}

/* ── LOADER ── */
#loader{position:fixed;inset:0;z-index:9999;background:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s ease,visibility 1s;}
#loader.out{opacity:0;visibility:hidden;pointer-events:none;}
#ll{width:260px;max-width:70vw;opacity:0;animation:lIn 1s .3s ease forwards;}
@keyframes lIn{from{opacity:0;transform:scale(.86) translateY(12px);}to{opacity:1;transform:scale(1) translateY(0);}}
.lbar{margin-top:2.4rem;width:150px;height:1px;background:rgba(85,69,165,.2);overflow:hidden;}
.lbar-f{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--pl));animation:lBar 2s .2s cubic-bezier(.4,0,.2,1) forwards;box-shadow:0 0 12px var(--pg);}
@keyframes lBar{to{width:100%;}}
.ltag{margin-top:1.1rem;font-size:.6rem;letter-spacing:.46em;text-transform:uppercase;color:var(--pl);opacity:0;animation:fIn .8s .95s forwards;}

/* ── CURSOR ── */
#cur{position:fixed;width:9px;height:9px;background:var(--pl);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);mix-blend-mode:screen;transition:transform .15s ease,width .2s,height .2s;}
#cur-ring{position:fixed;width:34px;height:34px;border:1px solid rgba(123,108,196,.45);border-radius:50%;pointer-events:none;z-index:9997;transform:translate(-50%,-50%);transition:width .3s,height .3s,border-color .3s;}

/* ── PROGRESS BAR ── */
#prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--purple),var(--pl));z-index:9000;width:0;pointer-events:none;box-shadow:0 0 8px var(--pg);}

/* ── LANG — bottom right corner, horizontal ── */
#lang{position:fixed;bottom:1.6rem;right:1.6rem;z-index:600;display:flex;gap:.45rem;}
.lb{width:34px;height:34px;border:1px solid rgba(85,69,165,.25);border-radius:2px;background:rgba(5,5,7,.8);backdrop-filter:blur(8px);color:var(--grey);font-size:.6rem;letter-spacing:.06em;font-weight:500;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;}
.lb:hover,.lb.on{border-color:var(--purple);color:var(--white);background:rgba(85,69,165,.22);box-shadow:0 0 12px rgba(85,69,165,.3);}
.lb.on{color:var(--pl);}

/* ── NAV ── */
nav{
  position:fixed !important;
  top:0 !important;
  left:0 !important;
  right:0 !important;
  width:100% !important;
  z-index:9000 !important;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:1.2rem 4rem;
  transition:background .4s ease,padding .3s ease,box-shadow .4s ease;
  background:rgba(5,5,7,0);
  box-sizing:border-box;
}
nav.sc{
  background:rgba(8,6,18,0.95) !important;
  backdrop-filter:blur(20px) !important;
  -webkit-backdrop-filter:blur(20px) !important;
  padding:.8rem 4rem !important;
  border-bottom:1px solid rgba(85,69,165,.2);
  box-shadow:0 2px 30px rgba(0,0,0,.6);
}
.nav-logo{height:30px;display:block;}
.nav-menu{display:flex;gap:2.8rem;list-style:none;}
.nav-menu a{color:var(--white);text-decoration:none;font-size:.74rem;font-weight:400;letter-spacing:.2em;text-transform:uppercase;opacity:.68;transition:opacity .3s,color .3s;}
.nav-menu a:hover{opacity:1;color:var(--pl);}
.nav-cta{border:1px solid rgba(123,108,196,.45)!important;padding:.5rem 1.5rem!important;border-radius:2px;opacity:1!important;transition:background .3s,border-color .3s,box-shadow .3s!important;}
.nav-cta:hover{background:var(--purple)!important;border-color:var(--purple)!important;box-shadow:0 0 26px var(--pg)!important;}

/* ── HERO ── */
#hero{position:relative;height:100vh;min-height:650px;overflow:hidden;display:flex;align-items:center;justify-content:flex-start;}

/* Parallax layers */
.par-bg{position:absolute;inset:-12%;background-size:cover;background-position:center;will-change:transform;}
.par-layer1{filter:brightness(.44) saturate(1.3);}
.par-layer2{filter:brightness(.18) saturate(.6);mix-blend-mode:multiply;}

.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,5,7,.3) 0%,rgba(5,5,7,.05) 25%,rgba(5,5,7,.45) 72%,rgba(5,5,7,1) 100%),linear-gradient(135deg,rgba(5,5,7,.35) 0%,transparent 55%,rgba(5,5,7,.25) 100%);}
.hero-grain{position:absolute;inset:0;opacity:.038;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:180px 180px;pointer-events:none;}
.hero-aurora{position:absolute;inset:0;background:radial-gradient(600px circle at var(--ax,50%) var(--ay,50%),rgba(85,69,165,.16),transparent 60%);pointer-events:none;transition:none;}

/* ── HERO CONTENT — truly centered ── */
.hero-content{
  position:relative;z-index:3;
  display:flex;flex-direction:column;align-items:flex-start;
  text-align:left;
  width:55%;max-width:720px;
  padding:0 4rem 0 6rem;
  margin-left:0;
  margin-right:auto;
  /* NO transform here — parallax applied only to background layers */
}
.hero-eyebrow{font-size:.68rem;letter-spacing:.4em;text-transform:uppercase;color:var(--pl);margin-bottom:1.8rem;opacity:0;animation:fUp 1s .5s forwards;text-align:left;}
.hero-title{text-align:left;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(3rem,7vw,8.5rem);
  font-weight:300;line-height:.94;
  letter-spacing:-.01em;
  opacity:0;animation:fUp 1s .8s forwards;
  width:100%;
}
.hero-title em{font-style:italic;color:var(--pl);}
.hero-sub{font-size:clamp(.8rem,.95vw,.92rem);letter-spacing:.07em;color:var(--grey);margin-top:2rem;line-height:1.9;opacity:0;animation:fUp 1s 1.1s forwards;max-width:520px;text-align:left;}
.hero-actions{display:flex;gap:1.4rem;justify-content:flex-start;margin-top:2.8rem;opacity:0;animation:fUp 1s 1.3s forwards;flex-wrap:wrap;}
.btn-p{display:inline-block;padding:.95rem 2.6rem;background:var(--purple);color:var(--white);text-decoration:none;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;border-radius:2px;transition:background .3s,box-shadow .3s,transform .2s;box-shadow:0 0 36px rgba(85,69,165,.4);}
.btn-p:hover{background:var(--pl);box-shadow:0 0 56px rgba(85,69,165,.7);transform:translateY(-2px);}
.btn-g{display:inline-block;padding:.95rem 2.6rem;border:1px solid rgba(247,245,255,.28);color:var(--white);text-decoration:none;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;border-radius:2px;transition:border-color .3s,background .3s,transform .2s;}
.btn-g:hover{border-color:var(--pl);background:rgba(85,69,165,.1);transform:translateY(-2px);}
.hero-scroll{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.5rem;opacity:0;animation:fIn 1s 2.2s forwards;z-index:3;}
.hero-scroll span{font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:var(--grey);}
.scroll-line{width:1px;height:44px;background:linear-gradient(to bottom,var(--pl),transparent);animation:sPulse 2s ease-in-out infinite;}
@keyframes sPulse{0%,100%{opacity:.35;transform:scaleY(1);}50%{opacity:1;transform:scaleY(1.15);}}

/* ── CANVAS PARTICLES (behind hero) ── */
#ptcl{position:absolute;inset:0;z-index:2;pointer-events:none;}

/* ── MARQUEE ── */
.mwrap{overflow:hidden;border-top:1px solid rgba(85,69,165,.18);border-bottom:1px solid rgba(85,69,165,.18);background:rgba(85,69,165,.05);padding:.9rem 0;}
.mtrack{display:flex;gap:4rem;animation:mscroll 28s linear infinite;white-space:nowrap;}
.mitem{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.28em;color:var(--pl);opacity:.65;flex-shrink:0;display:flex;align-items:center;gap:2rem;}
.mdot{width:4px;height:4px;border-radius:50%;background:var(--purple);flex-shrink:0;}
@keyframes mscroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ── SHARED ── */
section{padding:9rem 0;}
.ctr{max-width:1280px;margin:0 auto;padding:0 4rem;}
.sec-label{font-size:.65rem;letter-spacing:.44em;text-transform:uppercase;color:var(--pl);margin-bottom:1.3rem;display:block;}
.sec-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2.6rem,4.2vw,4.6rem);font-weight:300;line-height:1.06;}
.sec-title em{font-style:italic;color:var(--pl);}
.divider{height:1px;background:linear-gradient(to right,transparent,rgba(85,69,165,.4),transparent);}

/* ── SCROLL ANIMATIONS ── */
.sa{opacity:0;transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1);}
.sa.from-bottom{transform:translateY(48px);}
.sa.from-left{transform:translateX(-48px);}
.sa.from-right{transform:translateX(48px);}
.sa.scale-in{transform:scale(.94);}
.sa.visible{opacity:1;transform:none;}
.d1{transition-delay:.1s;}.d2{transition-delay:.2s;}.d3{transition-delay:.3s;}.d4{transition-delay:.4s;}.d5{transition-delay:.5s;}

/* ── ABOUT ── */
#about{background:var(--dark);position:relative;overflow:hidden;}
#about::before{content:'';position:absolute;top:-15%;right:-8%;width:550px;height:550px;background:radial-gradient(circle,rgba(85,69,165,.13) 0%,transparent 68%);pointer-events:none;}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:7rem;align-items:center;}
.about-text p{font-size:1.03rem;line-height:1.95;color:rgba(247,245,255,.7);margin-bottom:1.4rem;}
.about-quote{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:300;font-style:italic;line-height:1.6;color:var(--pl);border-left:2px solid var(--purple);padding-left:1.5rem;margin:2rem 0;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem;margin-top:3rem;}
.stat{padding:1.4rem 1rem;border:1px solid rgba(85,69,165,.2);border-radius:3px;background:rgba(85,69,165,.05);transition:border-color .3s,background .3s,transform .3s;cursor:default;text-align:center;}
.stat:hover{border-color:rgba(85,69,165,.5);background:rgba(85,69,165,.1);transform:translateY(-4px);}
.stat-n{font-family:'Cormorant Garamond',serif;font-size:2.6rem;font-weight:300;color:var(--pl);line-height:1;}
.stat-l{font-size:.66rem;letter-spacing:.14em;color:var(--grey);text-transform:uppercase;margin-top:.3rem;}
.about-imgs{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:1rem;align-items:end;}
.about-img-main{width:100%;height:480px;object-fit:cover;object-position:center 30%;border-radius:2px;display:block;}
.about-img-side{width:100%;height:480px;object-fit:cover;object-position:center top;border-radius:2px;display:block;}
.img-frame{position:absolute;top:-1.2rem;left:-1.2rem;right:2rem;bottom:1.2rem;border:1px solid rgba(85,69,165,.25);border-radius:2px;pointer-events:none;z-index:-1;}

/* ── NUMBERS BAND ── */
#numbers{background:var(--purple);padding:4rem 0;}
.num-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-left:1px solid rgba(255,255,255,.15);width:100%;}
.num-item{padding:3.5rem 1rem;border-right:1px solid rgba(255,255,255,.15);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;}
.num-val{font-family:'Cormorant Garamond',serif;font-size:3.5rem;font-weight:300;color:var(--white);line-height:1;}
.num-label{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(247,245,255,.65);margin-top:.5rem;}

/* ── SERVICES ── */
#services{background:var(--black);position:relative;}
.services-intro{text-align:center;max-width:600px;margin:0 auto 5rem;color:rgba(247,245,255,.65);font-size:1rem;line-height:1.9;}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;background:rgba(85,69,165,.14);}
.sc{background:var(--black);padding:2.8rem 2.4rem;position:relative;overflow:hidden;transition:background .4s;cursor:default;}
.sc::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,var(--purple),transparent);transform:scaleX(0);transition:transform .45s;}
.sc:hover{background:rgba(85,69,165,.07);}
.sc:hover::after{transform:scaleX(1);}
.sc-num{font-family:'Bebas Neue',sans-serif;font-size:3.5rem;color:rgba(85,69,165,.12);line-height:1;margin-bottom:1.3rem;transition:color .4s;}
.sc:hover .sc-num{color:rgba(85,69,165,.28);}
.sc-name{font-family:'Cormorant Garamond',serif;font-size:1.72rem;font-weight:400;margin-bottom:.9rem;}
.sc-desc{font-size:.85rem;line-height:1.84;color:var(--grey);}
.sc-glow{position:absolute;bottom:-50px;right:-50px;width:150px;height:150px;background:radial-gradient(circle,rgba(85,69,165,.28) 0%,transparent 70%);opacity:0;transition:opacity .4s;pointer-events:none;}
.sc:hover .sc-glow{opacity:1;}
/* Ripple */
.ripple{position:absolute;border-radius:50%;background:rgba(123,108,196,.25);pointer-events:none;transform:scale(0);animation:rOut .75s ease-out forwards;}
@keyframes rOut{to{transform:scale(5);opacity:0;}}
/* Spotlight */
#svc-spot{position:absolute;inset:0;background:radial-gradient(400px circle at var(--sx,-999px) var(--sy,-999px),rgba(123,108,196,.1) 0%,transparent 65%);pointer-events:none;}

/* ── FULL-BLEED DIVIDER PHOTO ── */
.photo-break{position:relative;height:70vh;overflow:hidden;}
.photo-break-bg{position:absolute;inset:-15%;background-size:cover;background-position:center;will-change:transform;}
.photo-break-overlay{position:absolute;inset:0;background:rgba(5,5,7,.6);display:flex;align-items:center;justify-content:center;}
.photo-break-text{text-align:center;z-index:2;}
.photo-break-text h2{font-family:'Cormorant Garamond',serif;font-size:clamp(2.5rem,5vw,5.5rem);font-weight:300;font-style:italic;line-height:1.1;}
.photo-break-text p{font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;color:var(--pl);margin-top:1rem;}

/* ── PROCESS ── */
#process{background:var(--dark);}
.process-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:3rem;margin-top:5rem;position:relative;}
.process-steps::before{content:'';position:absolute;top:2rem;left:2rem;right:2rem;height:1px;background:linear-gradient(to right,transparent,rgba(85,69,165,.4),rgba(85,69,165,.4),transparent);}
.step{text-align:center;padding-top:1rem;}
.step-num{width:40px;height:40px;border:1px solid var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--pl);margin:0 auto 1.5rem;background:var(--dark);position:relative;z-index:1;}
.step-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400;margin-bottom:.7rem;}
.step-desc{font-size:.84rem;line-height:1.8;color:var(--grey);}

/* ── GALLERY ── */
#gallery{background:var(--black);padding-bottom:0;}
.gallery-tabs{display:flex;gap:1.5rem;margin:2.5rem 0 1.5rem;}
.gtab{background:none;border:none;font-family:'DM Sans',sans-serif;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);cursor:pointer;padding:.5rem 0;border-bottom:1px solid transparent;transition:color .3s,border-color .3s;}
.gtab.on{color:var(--pl);border-color:var(--pl);}
.gg{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;}
.gi{overflow:hidden;position:relative;cursor:zoom-in;}
.gi img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .65s cubic-bezier(.25,.46,.45,.94),filter .5s;filter:brightness(.8) saturate(.85);}
.gi:hover img{transform:scale(1.06);filter:brightness(1) saturate(1.12);}
.gi::after{content:'';position:absolute;inset:0;background:rgba(5,5,7,.22);transition:opacity .4s;}
.gi:hover::after{opacity:0;}
/* masonry */
.gi:nth-child(1){grid-column:1/6;height:400px;}
.gi:nth-child(2){grid-column:6/9;height:400px;}
.gi:nth-child(3){grid-column:9/13;height:400px;}
.gi:nth-child(4){grid-column:1/4;height:310px;}
.gi:nth-child(5){grid-column:4/8;height:310px;}
.gi:nth-child(6){grid-column:8/10;height:310px;}
.gi:nth-child(7){grid-column:10/13;height:310px;}
.gi:nth-child(8){grid-column:1/5;height:350px;}
.gi:nth-child(9){grid-column:5/9;height:350px;}
.gi:nth-child(10){grid-column:9/13;height:350px;}
.gi:nth-child(11){grid-column:1/7;height:290px;}
.gi:nth-child(12){grid-column:7/13;height:290px;}

/* ── TEAM ── */
#team{background:var(--dark);position:relative;overflow:hidden;}
#team::before{content:'';position:absolute;top:-20%;left:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(85,69,165,.09) 0%,transparent 68%);pointer-events:none;}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin-top:4rem;}
.tc{position:relative;overflow:hidden;border-radius:2px;}
.tiw{height:360px;overflow:hidden;position:relative;}
.tiw img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .6s,filter .5s;filter:grayscale(15%) brightness(.83);}
.tc:hover .tiw img{transform:scale(1.06);filter:grayscale(0%) brightness(.9);}
.tiw::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(5,5,7,.92) 0%,transparent 55%);}
.tinfo{position:absolute;bottom:0;left:0;right:0;padding:1.4rem;z-index:2;transition:opacity .3s;}
.tc:hover .tinfo{opacity:0;}
.tname{font-family:'Cormorant Garamond',serif;font-size:1.22rem;font-weight:400;}
.trole{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--pl);margin-top:.22rem;}
.tov{position:absolute;inset:0;background:linear-gradient(135deg,rgba(85,69,165,.93),rgba(28,19,68,.97));display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .4s;z-index:3;}
.tc:hover .tov{opacity:1;}
.tbio{font-size:.81rem;line-height:1.85;text-align:center;padding:1.8rem;}
.tbio strong{display:block;font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:400;margin-bottom:.3rem;}
.tbio .trole2{display:block;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(247,245,255,.52);margin-bottom:.85rem;}

/* ── TESTIMONIALS ── */
#testimonials{background:var(--black);overflow:hidden;position:relative;}
#testimonials::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(85,69,165,.1) 0%,transparent 70%);pointer-events:none;}
.tsl-wrap{max-width:820px;margin:0 auto;text-align:center;}
.tsl-big-q{font-family:'Cormorant Garamond',serif;font-size:6rem;line-height:.4;color:var(--purple);opacity:.25;display:block;margin-bottom:2rem;}
.tsl-text{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,2.2vw,1.9rem);font-weight:300;font-style:italic;line-height:1.65;opacity:.9;transition:opacity .4s;}
.tsl-auth{margin-top:2rem;font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:var(--pl);transition:opacity .4s;}
.tsl-dots{display:flex;gap:.6rem;justify-content:center;margin-top:2.6rem;}
.tdot{width:5px;height:5px;border-radius:50%;background:var(--grey);cursor:pointer;transition:background .3s,transform .3s;border:none;}
.tdot.on{background:var(--pl);transform:scale(1.5);}

/* ── WHY US ── */
#why{background:var(--dark);}
.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:7rem;align-items:center;}
.why-list{display:flex;flex-direction:column;gap:2rem;margin-top:3rem;}
.why-item{display:flex;gap:1.5rem;align-items:flex-start;}
.why-icon{width:44px;height:44px;flex-shrink:0;border:1px solid rgba(85,69,165,.3);border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--pl);font-size:1.1rem;margin-top:.1rem;}
.why-text h4{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:400;margin-bottom:.4rem;}
.why-text p{font-size:.86rem;line-height:1.82;color:var(--grey);}
.why-visual{position:relative;}
.why-img-stack{position:relative;height:600px;}
.why-img-a{width:72%;height:100%;object-fit:cover;border-radius:2px;display:block;position:absolute;top:0;left:0;}
.why-img-b{width:52%;height:55%;object-fit:cover;border-radius:2px;display:block;position:absolute;bottom:-2rem;right:-1rem;border:4px solid var(--dark);box-shadow:0 0 40px rgba(85,69,165,.3);}
.why-badge{position:absolute;top:1.5rem;right:-1rem;background:var(--purple);color:var(--white);padding:1rem 1.2rem;border-radius:2px;text-align:center;z-index:2;box-shadow:0 0 30px rgba(85,69,165,.5);}
.why-badge .badge-n{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;line-height:1;}
.why-badge .badge-l{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;opacity:.8;margin-top:.2rem;}

/* ── CONTACT ── */
#contact{background:var(--black);position:relative;overflow:hidden;}
#contact::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(85,69,165,.09) 0%,transparent 68%);pointer-events:none;}
.csplit{display:grid;grid-template-columns:1fr 1fr;gap:7rem;align-items:start;}
.c-info p{font-size:1rem;line-height:1.95;color:rgba(247,245,255,.65);margin-bottom:2.8rem;}
.c-details{display:flex;flex-direction:column;gap:1.1rem;}
.c-detail{display:flex;align-items:center;gap:1rem;font-size:.85rem;color:var(--grey);}
.c-icon{width:34px;height:34px;border:1px solid rgba(85,69,165,.28);border-radius:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--pl);font-size:.8rem;}
.c-detail a{color:var(--grey);text-decoration:none;transition:color .3s;}
.c-detail a:hover{color:var(--pl);}
.cf{display:flex;flex-direction:column;gap:1.1rem;}
.fg{display:flex;flex-direction:column;gap:.42rem;}
.fg label{font-size:.64rem;letter-spacing:.26em;text-transform:uppercase;color:var(--grey);}
.fg input,.fg textarea,.fg select{background:rgba(255,255,255,.04);border:1px solid rgba(85,69,165,.18);color:var(--white);padding:.92rem 1.1rem;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:300;border-radius:2px;outline:none;transition:border-color .3s,background .3s,box-shadow .3s;width:100%;}
.fg input:focus,.fg textarea:focus,.fg select:focus{border-color:var(--purple);background:rgba(85,69,165,.06);box-shadow:0 0 16px rgba(85,69,165,.14);}
.fg select option{background:var(--dark);}
.fg textarea{resize:vertical;min-height:110px;}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;}
.f-sub{margin-top:.4rem;padding:1.05rem 2rem;background:var(--purple);color:var(--white);border:none;font-family:'DM Sans',sans-serif;font-size:.72rem;letter-spacing:.25em;text-transform:uppercase;border-radius:2px;cursor:pointer;transition:background .3s,box-shadow .3s,transform .2s;box-shadow:0 0 26px rgba(85,69,165,.28);}
.f-sub:hover{background:var(--pl);box-shadow:0 0 46px rgba(85,69,165,.6);transform:translateY(-1px);}

/* ── FOOTER ── */
footer{background:var(--dark);border-top:1px solid rgba(85,69,165,.14);padding:5rem 0 2rem;}
.f-top{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr;gap:4rem;padding-bottom:3rem;border-bottom:1px solid rgba(85,69,165,.1);}
.f-brand img{height:28px;display:block;margin-bottom:1.1rem;}
.f-brand p{font-size:.82rem;line-height:1.85;color:var(--grey);max-width:280px;}
.f-col h4{font-size:.63rem;letter-spacing:.3em;text-transform:uppercase;color:var(--pl);margin-bottom:1.1rem;}
.f-col ul{list-style:none;}
.f-col li{margin-bottom:.6rem;}
.f-col a{color:var(--grey);text-decoration:none;font-size:.82rem;transition:color .3s;}
.f-col a:hover{color:var(--white);}
.f-bot{display:flex;justify-content:space-between;align-items:center;padding-top:1.8rem;flex-wrap:wrap;gap:1rem;}
.f-bot p{font-size:.72rem;color:rgba(152,148,170,.42);}
.f-soc{display:flex;gap:.8rem;}
.sol{width:32px;height:32px;border:1px solid rgba(85,69,165,.22);border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--grey);text-decoration:none;font-size:.8rem;transition:border-color .3s,color .3s,background .3s;}
.sol:hover{border-color:var(--purple);color:var(--white);background:rgba(85,69,165,.15);}

/* ── ANIM ── */
@keyframes fUp{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:translateY(0);}}
@keyframes fIn{from{opacity:0;}to{opacity:1;}}

/* ── MOBILE ── */
@media(max-width:1024px){
  nav{padding:1rem 1.5rem !important;}nav.sc{padding:.7rem 1.5rem !important;}
  .ctr{padding:0 2rem;}
  .about-grid{grid-template-columns:1fr;gap:4rem;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .num-grid{grid-template-columns:repeat(2,1fr);}
  .sg{grid-template-columns:repeat(2,1fr);}
  .process-steps{grid-template-columns:repeat(2,1fr);}
  .tgrid{grid-template-columns:repeat(2,1fr);}
  .csplit{grid-template-columns:1fr;gap:4rem;}
  .f-top{grid-template-columns:1fr 1fr;gap:3rem;}
  .why-grid{grid-template-columns:1fr;gap:4rem;}
}
@media(max-width:768px){
  .nav-menu{display:none;}
  section{padding:5rem 0;}
  .sg{grid-template-columns:1fr;}
  .gi:nth-child(1){grid-column:1/13;}
  .gi:nth-child(2){grid-column:1/7;}
  .gi:nth-child(3){grid-column:7/13;}
  .gi:nth-child(4){grid-column:1/13;}
  .gi:nth-child(5){grid-column:1/7;}
  .gi:nth-child(6){grid-column:7/13;}
  .gi:nth-child(7){grid-column:1/13;}
  .gi:nth-child(8){grid-column:1/7;}
  .gi:nth-child(9){grid-column:7/13;}
  .gi:nth-child(10){grid-column:1/13;}
  .gi:nth-child(11){grid-column:1/13;}
  .gi:nth-child(12){grid-column:1/13;}
  .tgrid{grid-template-columns:repeat(2,1fr);gap:1rem;}
  .tiw{height:280px;}
  .tov{overflow-y:auto;}
  .tbio{font-size:.72rem;line-height:1.7;padding:1rem;}
  .tbio strong{font-size:1rem;}
  .fr2{grid-template-columns:1fr;}
  .f-top{grid-template-columns:1fr;}
  .hero-actions{flex-direction:column;align-items:center;}
  .process-steps::before{display:none;}
  .about-imgs{grid-template-columns:1fr;gap:1rem;}
  .about-img-main,.about-img-side{height:280px;width:100%;}
  .about-img-side{display:block;}
}
@media(max-width:480px){
  .tgrid{grid-template-columns:1fr;gap:1.2rem;}
  .tiw{height:320px;}
  .tbio{font-size:.78rem;padding:1.4rem;}
  .tbio strong{font-size:1.05rem;}
  .ctr{padding:0 1.2rem;}
  .num-grid{grid-template-columns:1fr 1fr;}
  .stats-row{grid-template-columns:1fr 1fr;}
}

/* ── ENHANCED HERO IMAGE ── */
.hero-img-float{
  position:absolute;
  right:0;bottom:0;top:0;
  width:45%;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}
.hero-img-float img{
  width:100%;height:100%;
  object-fit:cover;object-position:center top;
  display:block;
  opacity:0;
  animation:fIn 1.4s 1.2s ease forwards;
  mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,0.6) 18%,black 45%,black 80%,transparent 100%),
             linear-gradient(to top,transparent 0%,black 8%,black 100%);
  -webkit-mask-image:linear-gradient(to right,transparent 0%,rgba(0,0,0,0.6) 18%,black 45%,black 80%,transparent 100%),
             linear-gradient(to top,transparent 0%,black 8%,black 100%);
  mask-composite:intersect;
  -webkit-mask-composite:source-in;
  filter:brightness(.75) saturate(1.15);
}
@media(max-width:900px){.hero-img-float{display:none;}}


/* ── HERO CINEMATIC ANIMATION ── */
@keyframes kbZoom{
  0%{transform:translateY(0px) scale(1.06);}
  100%{transform:translateY(calc(var(--sy,0px) * 0.4)) scale(1.0);}
}
@keyframes kbPan{
  0%{transform:translateY(0px) scale(1.04) translateX(-1%);}
  100%{transform:translateY(calc(var(--sy,0px) * 0.2)) scale(1.0) translateX(0%);}
}
#hbg1{animation:kbZoom 18s ease-out forwards;}
#hbg2{animation:kbPan 22s ease-out forwards;}
.par-layer1{filter:brightness(.5) saturate(1.2);}


@media(max-width:900px){
  .hero-content{margin-left:auto;max-width:960px;align-items:center;}
  .hero-eyebrow,.hero-sub{text-align:center;}
  .hero-actions{justify-content:center;}
}

@media(max-width:900px){
  .hero-content{width:90%;padding:0 2rem;align-items:center;text-align:center;}
  .hero-title{text-align:center;}
  .hero-sub{text-align:center;}
  .hero-actions{justify-content:center;}
}
</style>
